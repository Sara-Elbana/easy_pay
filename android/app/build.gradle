plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.easy_pay_app"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.easybay"
        minSdkVersion = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            appIcon: "@mipmap/ic_launcher",
            applicationName: "android.app.Application"
        ]
    }

    flavorDimensions "default"

    productFlavors {
        production {
            dimension "default"
            applicationIdSuffix ".production"
            resValue "string", "app_name", "EasyBay Production"
            manifestPlaceholders = [
                appIcon: "@mipmap/ic_launcher"
            ]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stage"
            resValue "string", "app_name", "EasyBay Stage"
            manifestPlaceholders = [
                appIcon: "@mipmap/ic_launcher_staging"
            ]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "EasyBay Development"
            manifestPlaceholders = [
                appIcon: "@mipmap/ic_launcher_dev"
            ]
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
    }
}
